# Flare — bookmark homepage
# docker compose up -d
# open http://localhost:5005

services:
  flare:
    image: cyzzxc/flare:latest
    container_name: flare
    ports:
      - "5005:5005"
    volumes:
      - ./data:/app
    # environment:
    #   FLARE_USER: flare
    #   FLARE_PASS: change-me
    #   FLARE_DISABLE_LOGIN: "true"
    #   FLARE_API: "true"
    #   FLARE_API_KEY: ""
    restart: unless-stopped
